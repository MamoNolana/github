name: Build AutoCapture 360 A34

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Забираем файлы репозитория
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Устанавливаем Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Устанавливаем Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # 4. Устанавливаем нужные компоненты SDK
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Находим ZIP с проектом
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            \( -name "AutoCapture360A34-GitHub.zip" \
            -o -name "AutoCapture360A34-project.zip" \
            -o -name "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 6. Распаковываем проект
      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "${{ steps.find_zip.outputs.zip }}" \
            -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 2 -type f | sort

      # 7. Определяем корень проекта
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="android-project"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] || \
             [ ! -d "$PROJECT_DIR/app" ]; then

            NESTED_DIR=$(find "$PROJECT_DIR" -mindepth 1 -maxdepth 2 \
              -type f -name "settings.gradle.kts" \
              -printf "%h\n" | head -n 1)

            if [ -n "$NESTED_DIR" ]; then
              PROJECT_DIR="$NESTED_DIR"
            fi
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found."
            exit 1
          fi

          echo "Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. Проверяем Gradle Wrapper
      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew --version

      # 9. Настраиваем Gradle cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 10. Собираем Debug APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 11. Проверяем, что APK действительно создан
      - name: Verify Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 12. Загружаем APK в GitHub Actions
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCapture360A34-debug
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Собираем Release APK
      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      # 14. Загружаем Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCapture360A34-release
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
